baseURL = "https://docs.sortie-ai.com/"
title = "Sortie"
locale = "en-US"
defaultContentLanguage = "en"
# Hugo outputs public/ which becomes the Cloudflare Pages deploy directory.
publishDir = "public"

# enableGitInfo replaces git-revision-date-localized MkDocs plugin.
# Requires the build environment to have full Git history (not a shallow clone).
enableGitInfo = true

# Taxonomies are unused on this site. Disabling removes empty /tags/ and
# /categories/ pages that Hugo generates by default and that Google flags as
# thin content.
disableKinds = ["taxonomy", "term"]

# Enable inline HTML in Markdown (needed for existing content with raw HTML).
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]
[markup.highlight]
noClasses = false
lineNos = false
style = "github"

# Summaries for section index pages.
summaryLength = 70

# Front matter date resolution order.
# .Date / .PublishDate → from 'date' front matter (git creation date, populated during migration).
# .Lastmod → from git author date of last commit, fallback to 'lastmod' front matter.
[frontmatter]
date = ['date', ':default']
lastmod = [':git', 'lastmod', ':default']
publishDate = ['date', ':default']

[params]
description = "Sortie turns Jira and GitHub issues into autonomous coding agent sessions. A single Go binary with adapters for Claude Code, Codex, Copilot, and more."

# Version announcement banner. Set to false to disable entirely.
# message: custom text; leave empty to use the default "Sortie vX.Y.Z is here!" message.
[params.banner]
message = ""

# Global KaTeX support (replaces pymdownx.arithmatex).
# params.math must be a table, not a bool — Hextra accesses params.math.engine.
[params.math]
engine = "katex"

# Hextra display settings.
[params.theme]
default = "system"
displayToggle = true

# Repository link for "Edit this page on GitHub" in the TOC sidebar.
[params.editURL]
enable = true
base = "https://github.com/sortie-ai/docs/edit/main/content"

# Navbar logo configuration.
[params.navbar]
displayTitle = true
displayLogo = true
[params.navbar.logo]
path = "img/logo-dark.png"
dark = "img/logo-light.png"
width = 20
height = 20
link = "/"

# Sidebar configuration.
[params.sidebar]
hide = false

# Footer.
[params.footer]
enable = true
displayCopyright = true
displayPoweredBy = false

# Search (Hextra's built-in FlexSearch).
[params.search]
enable = true
type = "flexsearch"

# Page width.
[params.page]
width = "normal"

# "Copy Page" context menu with AI integrations.
#
# Markdown is obtained at runtime from Cloudflare content negotiation
# (Accept: text/markdown on the canonical URL); no static .md mirrors are
# generated. Two project overrides make this work without the markdown output
# format Hextra normally requires:
#   - layouts/_partials/components/page-context-menu.html (points at the
#     canonical URL, drops the markdown-output gate and the "View as Markdown"
#     item, which a browser navigation cannot negotiate)
#   - assets/js/core/page-context-menu.js (sends the Accept: text/markdown header)
[params.page.contextMenu]
enable = true

[[params.page.contextMenu.links]]
name = "Open in ChatGPT"
icon = "chatgpt"
url = "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{markdown_url}%0AHelp+me+understand+how+to+use+it."

[[params.page.contextMenu.links]]
name = "Open in Claude"
icon = "claude"
url = "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{markdown_url}%0AHelp+me+understand+how+to+use+it."

[menu]
[[menu.main]]
name = "Search"
weight = 10
[menu.main.params]
type = "search"

[module]
[[module.imports]]
path = "github.com/imfing/hextra"

# --------------------------------------------------------------------------
# llms.txt support — https://llmstxt.org/
# Generates /llms.txt (navigation index) and /llms-full.txt (full content)
# at build time. Per-page Markdown is served on demand by Cloudflare via
# content negotiation (Accept: text/markdown), so no static .md mirrors are
# emitted.
# --------------------------------------------------------------------------

# llms.txt — navigation index linking to each page.
[outputFormats.LLMsTxt]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true
rel = "alternate"

# llms-full.txt — entire documentation concatenated as Markdown.
# NOTE: "LLMsFull" lowercases to "llmsfull" which matches the template
# filename layouts/index.llmsfull.txt so that isPlainText=true applies.
[outputFormats.LLMsFull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true
rel = "alternate"

[outputs]
# Home page generates HTML + both LLM text files.
home = ["HTML", "RSS", "LLMsTxt", "LLMsFull"]
# Regular pages and sections generate HTML only.
page = ["HTML"]
section = ["HTML"]
