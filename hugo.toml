baseURL = "https://docs.sortie-ai.com/"
title = "Sortie"
locale = "en-US"
defaultContentLanguage = "en"
# Hugo outputs public/, which wrangler.toml exposes as the Cloudflare Workers
# static-assets directory ([assets] directory = "./public").
publishDir = "public"

# enableGitInfo replaces git-revision-date-localized MkDocs plugin.
# Requires the build environment to have full Git history (not a shallow clone).
enableGitInfo = true

# Taxonomies are unused on this site. Disabling removes empty /tags/ and
# /categories/ pages that Hugo generates by default and that Google flags as
# thin content.
disableKinds = ["taxonomy", "term"]

# Enable inline HTML in Markdown (needed for existing content with raw HTML).
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]
[markup.highlight]
noClasses = false
lineNos = false
style = "github"

# Summaries for section index pages.
summaryLength = 70

# Front matter date resolution order.
# .Date / .PublishDate → from 'date' front matter (git creation date, populated during migration).
# .Lastmod → from git author date of last commit, fallback to 'lastmod' front matter.
[frontmatter]
date = ['date', ':default']
lastmod = [':git', 'lastmod', ':default']
publishDate = ['date', ':default']

[params]
description = "Sortie turns Jira and GitHub issues into autonomous coding agent sessions. A single Go binary with adapters for Claude Code, Codex, Copilot, and more."

# Version announcement banner. Set to false to disable entirely.
# message: custom text; leave empty to use the default "Sortie vX.Y.Z is here!" message.
[params.banner]
message = ""

# Global KaTeX support (replaces pymdownx.arithmatex).
# params.math must be a table, not a bool — Hextra accesses params.math.engine.
[params.math]
engine = "katex"

# Hextra display settings.
[params.theme]
default = "system"
displayToggle = true

# Repository link for "Edit this page on GitHub" in the TOC sidebar.
[params.editURL]
enable = true
base = "https://github.com/sortie-ai/docs/edit/main/content"

# Navbar logo configuration.
[params.navbar]
displayTitle = true
displayLogo = true
[params.navbar.logo]
path = "img/logo-dark.png"
dark = "img/logo-light.png"
width = 20
height = 20
link = "/"

# Sidebar configuration.
[params.sidebar]
hide = false

# Footer.
[params.footer]
enable = true
displayCopyright = true
displayPoweredBy = false

# Search (Hextra's built-in FlexSearch).
[params.search]
enable = true
type = "flexsearch"

# Page width.
[params.page]
width = "normal"

# "Copy Page" context menu with AI integrations.
#
# The menu copies Markdown obtained at runtime from Cloudflare content
# negotiation (Accept: text/markdown on the canonical URL) — not from the
# static .md mirrors declared at the bottom of this file. Both representations
# exist on purpose and neither replaces the other: the mirrors are stable URLs
# an agent can guess without knowing about content negotiation, while
# negotiation is what a fetch() from this page can use without navigating the
# browser away to a different URL. Two project overrides keep the menu on the
# negotiated path:
#   - layouts/_partials/components/page-context-menu.html (points at the
#     canonical URL, drops the markdown-output gate and the "View as Markdown"
#     item, which a browser navigation cannot negotiate)
#   - assets/js/core/page-context-menu.js (sends the Accept: text/markdown header)
[params.page.contextMenu]
enable = true

[[params.page.contextMenu.links]]
name = "Open in ChatGPT"
icon = "chatgpt"
url = "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{markdown_url}%0AHelp+me+understand+how+to+use+it."

[[params.page.contextMenu.links]]
name = "Open in Claude"
icon = "claude"
url = "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{markdown_url}%0AHelp+me+understand+how+to+use+it."

[menu]
# The product site. Deliberately a separate entry from the navbar logo, which
# links to "/" — the docs root on this host — so the two are not the same
# destination dressed up twice. Hextra's navbar partial treats any URL
# starting with http as external and adds target/rel itself.
[[menu.main]]
name = "Sortie Home"
url = "https://sortie-ai.com/"
weight = 1

[[menu.main]]
name = "Search"
weight = 10
[menu.main.params]
type = "search"

[module]
[[module.imports]]
path = "github.com/imfing/hextra"

# --------------------------------------------------------------------------
# Machine-facing output formats: /llms.txt, /llms-full.txt, and a per-page
# Markdown mirror at <path>/index.md.
#
# Only /llms.txt comes from a specification. https://llmstxt.org/ defines
# exactly one file — a navigation index at the site root — and nothing else.
#
# /llms-full.txt is NOT in that specification. It is a Mintlify convention
# that spread by imitation, and it is generated here only because agents that
# were built against Mintlify-hosted docs ask for it by name. Do not cite
# llmstxt.org as its authority; the comment that used to do so was wrong.
# --------------------------------------------------------------------------

[mediaTypes."text/markdown"]
suffixes = ["md"]

# llms.txt — navigation index linking to each page.
[outputFormats.LLMsTxt]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true
rel = "alternate"

# llms-full.txt — entire documentation concatenated as Markdown.
# NOTE: "LLMsFull" lowercases to "llmsfull" which matches the template
# filename layouts/index.llmsfull.txt so that isPlainText=true applies.
[outputFormats.LLMsFull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true
rel = "alternate"

# Markdown — the raw Markdown source of each page, published at <path>/index.md.
#
# The crawler control for these files lives in static/_headers, not here: the
# /*.md rule sends `X-Robots-Tag: noindex, nofollow`. That header is the whole
# control, and it is not optional.
#
# It is tempting to argue the header is unnecessary because text/markdown does
# not appear on Google's indexable-file-types list. That argument is wrong.
# The same Google page says the file type "is determined by the Content-Type
# HTTP header returned when Google crawls the file, though in some cases
# Google may use the file extension or re-parse the file using a different
# parser if the Content-Type header is missing or incorrect." So a dropped or
# rewritten Content-Type — one deleted _headers rule — puts these files back
# into a type Google does index. Absence from a documentation list is not a
# control; the response header is.
#
# What must NOT be added instead: a robots.txt Disallow. These files exist so
# that AI agents can read them, and a Disallow stops a compliant agent
# fetching them at all. It is also strictly worse than useless for indexing,
# because Google documents that for a URL disallowed in robots.txt "any
# information about indexing or serving rules will not be found and will
# therefore be ignored" — the noindex above would never be seen. static/robots.txt
# deliberately says nothing about .md; leave it that way.
#
# Two keys below are load-bearing:
#   - notAlternative = true keeps the .md URL out of
#     Page.AlternativeOutputFormats, so the HTML <head> never advertises it
#     with <link rel="alternate">.
#   - permalinkable is deliberately left unset (Hugo defaults it to false).
#     That is what keeps .md URLs out of sitemap.xml: Hugo's embedded sitemap
#     template emits .Permalink, and only a permalinkable output format makes
#     .Permalink return its own URL instead of the HTML one. Because this
#     rests on a Hugo default rather than on anything written here, re-verify
#     that sitemap.xml contains zero .md URLs after every Hugo upgrade.
[outputFormats.Markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
notAlternative = true
rel = "alternate"

[outputs]
# Home page generates HTML + both LLM text files.
home = ["HTML", "RSS", "LLMsTxt", "LLMsFull"]
# Regular pages generate HTML + a raw Markdown mirror at <path>/index.md.
page = ["HTML", "Markdown"]
# Sections generate HTML only (index pages mostly contain shortcodes).
section = ["HTML"]
