name: Release sync

# Check that content/changelog.md covers the latest published release, and raise
# an issue when it does not.
#
# This workflow does NOT rebuild or redeploy the site, because a rebuild would
# change nothing. Everything this site says about the current version comes from
# one place: the first `[x.y.z]` heading in content/changelog.md, which
# layouts/_partials/banner.html extracts at build time to drive the version
# banner. That file is a hand-written mirror of the product's CHANGELOG.md -
# release notes are prose, and nothing here can write them. Whoever syncs the
# changelog produces a commit, and that commit is what triggers the Cloudflare
# Workers Builds deploy.
#
# So the only honest thing to automate is the reminder.
#
# It used to be a doorbell: sortie-ai/sortie rang this repository with a
# repository_dispatch as soon as a release was published. Nothing is pushed here
# any more - this asks the Releases API on its own schedule instead. The cost is
# latency: a release published just after a run is noticed on the next one.

on:
  schedule:
    # Once a day. The reminder is a safety net for a changelog that is normally
    # synced by hand within the hour, so a longer wait than the site refresh is
    # fine. Off the hour: scheduled runs are delayed under load, which peaks at
    # :00.
    - cron: "27 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  check-changelog:
    name: Check changelog coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # /releases/latest skips drafts and pre-releases, so a tag pushed
          # mid-release cannot open an issue for a version nobody has announced.
          TAG=$(gh api repos/sortie-ai/sortie/releases/latest --jq '.tag_name')

          # Releases from 1.19.0 on carry a v-prefixed git tag while the version
          # number stays bare. The changelog headings are bare.
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest release tag '${TAG}' does not normalise to a bare X.Y.Z version"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "✓ latest published release is ${VERSION}"

      - name: Check whether content/changelog.md documents the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # Match the heading form used throughout the file:
          #   ## [1.18.0] - 2026-08-09 { #1.18.0 }
          escaped=${VERSION//./\\.}
          if grep -qE "^## \[${escaped}\]" content/changelog.md; then
            echo "✓ content/changelog.md already documents ${VERSION}"
            exit 0
          fi

          title="Sync changelog for ${VERSION}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            echo "✓ #${existing} is already open for ${VERSION}"
            exit 0
          fi

          gh issue create --title "${title}" --body-file - <<EOF
          [sortie ${VERSION}](https://github.com/sortie-ai/sortie/releases) is published, but \`content/changelog.md\` has no \`## [${VERSION}]\` heading.

          Until it does, the version banner on every page still announces the previous release: \`layouts/_partials/banner.html\` reads the first \`[x.y.z]\` heading in that file and nothing else.

          To close this, copy the new section from [CHANGELOG.md](https://github.com/sortie-ai/sortie/blob/main/CHANGELOG.md) into \`content/changelog.md\`, keeping the \`{ #x.y.z }\` heading anchor and adding the compare link at the bottom of the file. Pushing that commit is what redeploys the site.

          Opened automatically by \`.github/workflows/release-sync.yml\`.
          EOF
          echo "✓ opened an issue for ${VERSION}"
