name: Refresh site

# Rebuild and redeploy the site on a clock, without writing to the repository.
#
# The star count in the navbar is fetched by scripts/update-star-count.sh during
# the Cloudflare build and never committed, so publishing a fresher number needs
# nothing but a build. This workflow supplies the one trigger Workers Builds
# lacks: a schedule. It replaces star-count.yml, which refreshed the number by
# committing it to main and therefore raced with anyone pushing at the time.
#
# Pushes to main are deliberately NOT a trigger here. The Workers Builds git
# integration already builds every commit on main; an `on: push` in this file
# would build the same bytes a second time.

on:
  schedule:
    # Twice a day, deliberately off the hour: GitHub documents that scheduled
    # runs are delayed during high load, and load peaks at :00.
    - cron: "13 6,18 * * *"
  workflow_dispatch:

# The hook URL is the only credential involved, and nothing here reads or writes
# the repository.
permissions: {}

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  rebuild:
    name: Trigger a Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST the deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK}" ]; then
            echo "::error::CF_DEPLOY_HOOK_URL is not set. Create a hook under Settings -> Build -> Deploy Hooks in the Cloudflare dashboard and store its URL as a repository secret."
            exit 1
          fi

          # --fail-with-body makes a non-2xx fail the step while still printing
          # the body, so the log says what the API objected to.
          response=$(curl -sS --fail-with-body -X POST "${HOOK}")

          # A 2xx is not proof on its own: this endpoint reports a rejection as
          # success:false with an errors array, not as an HTTP error. Parsed
          # rather than grepped - the response is minified, and a pattern that
          # assumed pretty-printed JSON would pass on anything.
          printf '%s' "${response}" | python3 -c '
          import json, os, sys

          doc = json.load(sys.stdin)
          if not doc.get("success"):
              sys.exit("::error::deploy hook rejected the request: %s" % doc.get("errors"))

          result = doc.get("result", {})
          build = result.get("build_uuid", "<none>")
          # already_exists means an identical build was already queued and this
          # request was folded into it. Not an error, but worth seeing.
          print("::notice::queued build %s (already_exists=%s)" % (build, result.get("already_exists")))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Queued Cloudflare build `%s`\n" % build)
          '
