# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Links

# Content links are site paths such as /reference/cli/ that resolve only after
# Hugo applies each page's url, so the check runs on the built site.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.164.0
  HUGO_SHA256: fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hugo Modules fetch the theme through the Go toolchain.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          hugo=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${hugo}"
          printf '%s  %s\n' "$HUGO_SHA256" "$hugo" | sha256sum -c -
          tar -xzf "$hugo" hugo
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install lychee
        uses: sortie-ai/shared-workflows/.github/actions/setup-lychee@12099056fde09c3b1ef701128316e9fb883eba90 # v1.1.0

      - name: Build site
        run: npm run build

      # package.json cannot carry comments, so the reasons for the lint:links
      # flags live here.
      #
      # Markdown mirrors and llms*.txt are left out: their /<page>.md links are
      # answered by Cloudflare, not by a file in the build. The Grafana download
      # is a Cloudflare redirect to the sortie repository. The ChatGPT and
      # "Edit this page" links come from hugo.toml on every page; neither
      # answers a bot.
      #
      # Retries are off: a retried 429 from github.com rate-limits every
      # request queued behind it.
      - name: Check links and anchors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:links
